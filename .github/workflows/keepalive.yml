name: keepalive

# GitHub 는 60일 동안 활동이 없는 저장소의 예약 워크플로를 자동으로 꺼 버린다.
# 한 달에 두 번 빈 커밋을 남겨 tick 이 멈추지 않게 한다.
# 외부 액션을 쓰지 않는다(쓰기 권한이 있는 작업이라 공급망 위험을 없앤다) — 러너에 깔려 있는 gh 로 API 만 부른다.
on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Empty commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)
          tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
          new=$(gh api "repos/$REPO/git/commits" -f message=keepalive -f tree="$tree" -f "parents[]=$head" --jq .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$new" --jq .object.sha
